baseURL = 'https://ahmedkomsan.com/'
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
languageCode = "en"
pygmentsStyle = "monokai" # syntax highlighting style
title = 'Ahmed Komsan'
theme = "gokarna"
buildFuture = true


[params]
  avatarAltText = "Portrait of Ahmed Komsan"
  avatarSize = "size-m"
  avatarURL = "/avatar.jpg"
  showPostsOnHomePage = "recent"
  enableSharing = true
  footer = "Ahmed Komsan"

  # Adds KaTeX for rendering mathematical equations ($...$ for inline math, $$...$$ for block math).
  # Ensures that all math expressions inside posts are rendered properly.
  customHeadHTML = """
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" integrity="sha384-Xi8rHCmBmhbuyyhbI88391ZKP2dmfnOl4rT9ZfRI7mLTdk1wblIUnrIq35nqwEvC" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js" integrity="sha384-X/XCfMm41VSsqRNQgDerQczD69XqmjOOOwYQvr/uuC+j4OPoNhVgjdGFwhvN02Ja" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js" integrity="sha384-+XBljXPPiv+OzfbB3cVmLHf4hdUFHlWNZN5spNQ7rmHTXpd7WvJum6fIACpNNfIR" crossorigin="anonymous"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          // customised options
          // • auto-render specific keys, e.g.:
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
          ],
          // • rendering keys, e.g.:
          throwOnError : false
        });
      });
    </script>
  """

  description = "Senior iOS Engineer based in Linz, Austria, building scalable consumer apps with Swift, SwiftUI, UIKit, and modular architecture."
  metaKeywords = ["Ahmed Komsan", "Senior iOS Engineer", "iOS development", "Swift", "Swift 6", "SwiftUI", "UIKit", "Combine", "MVVM-C", "modular architecture", "mobile engineering"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages

  socialIcons = [
    # Professional Networks
    {name = "linkedin", url = "https://www.linkedin.com/in/ahmed-komsan/"},
    {name = "github", url = "https://github.com/Ahmed-Komsan"},
    {name = "stackoverflow", url = "https://stackoverflow.com/users/8940695/ahmed-komsan"},
    # Social Media
    {name = "twitter", url = "https://x.com/ahmed_komsan12"},
    {name = "instagram", url = "https://www.instagram.com/ahmed.komsan1/"},
    # Contact
    {name = "email", url = "mailto:ahmedkomsan0@gmail.com"}
  ]

[menu]
  [[menu.main]]
    name = "Home"
    pre = "<span data-feather='home'></span>"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "About"
    pre = "<span data-feather='user'></span>"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "Posts"
    pre = "<span data-feather='book'></span>"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    name = "Tags"
    pre = "<span data-feather='tag'></span>"
    url = "/tags/"
    weight = 4

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[minify]
    minifyOutput = true
